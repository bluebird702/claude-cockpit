# 골든셋 평가 게이트 — 리뷰어·검증자 품질 회귀를 머지 전에 잡는다.
#
# ci.yml 의 selftest 가 "채점기 mechanics" 검증이라면, 이 워크플로는 **LLM 리뷰어 자체**를
# 골든셋으로 채점한다 (agent-workflow.md §검증 게이트: "리뷰어 자체를 측정").
# 리뷰 체계(스킬·서브에이전트·룰셋·픽스처)를 바꾸는 PR 에서만 돈다 — 비용 통제.
#
# 인증: CLAUDE_CODE_OAUTH_TOKEN (Max 구독, `claude setup-token`) — abillity 서버리스
# 에이전트와 같은 패턴. 토큰 미설정이면 **fail-closed** (조용히 통과 금지 — philosophy §4).
#
# 정답 누설 방지: 리뷰 대상을 cases/ 만 복사한 임시 트리로 격리한다 — expected.jsonl ·
# verifier-cases.jsonl 이 리뷰어/검증자의 눈에 절대 들어가지 않게 (fixtures README §정답 누설 금지).

name: goldenset-eval

on:
  pull_request:
    paths:
      - 'humans/skills/review/**'
      - 'humans/subagents/review-*.md'
      - 'humans/review-fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldenset-eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  eval:
    # fork PR 은 secrets 이 없으므로 제외 (자기 레포 PR 전용)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 토큰 존재 확인 (fail-closed)
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 미설정 — 골든셋 게이트는 조용히 통과하지 않는다 (fail-closed)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.207

      - name: 리뷰 대상 격리 (정답 누설 방지)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goldenset"
          cp -R humans/review-fixtures/cases "$RUNNER_TEMP/goldenset/cases"
          # 검증자 입력: 정답(expected_verdict) 필드를 제거한 사본
          python3 - <<'PY'
          import json, os
          src = "humans/review-fixtures/verifier-cases.jsonl"
          out = os.path.join(os.environ["RUNNER_TEMP"], "goldenset", "verifier_input.json")
          cases = [json.loads(l) for l in open(src, encoding="utf-8") if l.strip()]
          stripped = [{k: c[k] for k in ("id", "file", "finding")} for c in cases]
          json.dump(stripped, open(out, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY

      - name: 리뷰어 실행 (findings 방출)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          claude -p --dangerously-skip-permissions --output-format text \
            "당신은 코드 리뷰어다. 이 레포의 humans/skills/review/{architecture,code,test,security,performance,resilience,deps}.md 의 Step 2 체크리스트를 기준으로, $RUNNER_TEMP/goldenset/cases 아래 모든 파일을 리뷰하라.
          규칙:
          - 각 파일을 실제로 Read 하고 판정한다 (파일명만 보고 판단 금지).
          - humans/review-fixtures/ 아래의 expected.jsonl, verifier-cases.jsonl, eval*.py, README.md 는 절대 읽지 않는다 (읽으면 평가 무효).
          - scale.tier 는 hyperscale 로 간주한다.
          - 발견을 JSON 배열로 $RUNNER_TEMP/goldenset/run_findings.json 에 Write 하라.
            스키마: [{\"area\": \"security|code|test|architecture|performance|resilience|deps\", \"category\": \"kebab-case\", \"severity\": \"critical|high|medium|low\", \"file\": \"cases/<하위경로>:<줄>\"}]
          - file 경로는 반드시 cases/ 로 시작하는 상대경로로 쓴다.
          - 마지막에 파일이 유효한 JSON 인지 확인하라."
          test -s "$RUNNER_TEMP/goldenset/run_findings.json"

      - name: 리뷰어 채점 (P/R 게이트)
        run: python3 humans/review-fixtures/eval.py --findings "$RUNNER_TEMP/goldenset/run_findings.json"

      - name: 검증자 실행 (verdict 방출)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          claude -p --dangerously-skip-permissions --output-format text \
            "당신은 리뷰 발견의 적대적 검증자다 (humans/subagents/review-verifier.md 의 절차를 그대로 따른다).
          $RUNNER_TEMP/goldenset/verifier_input.json 의 각 케이스에 대해:
          - $RUNNER_TEMP/goldenset/<file> 을 직접 Read 하고, finding 주장을 반증 시도하라.
          - 기본 입장은 반증이며, 반증에 실패했을 때만 confirmed.
          - humans/review-fixtures/ 아래의 expected.jsonl, verifier-cases.jsonl 은 절대 읽지 않는다 (읽으면 평가 무효).
          판정을 JSON 배열로 $RUNNER_TEMP/goldenset/run_verdicts.json 에 Write 하라.
          스키마: [{\"id\": \"<케이스 id>\", \"verdict\": \"confirmed|refuted\"}]"
          test -s "$RUNNER_TEMP/goldenset/run_verdicts.json"

      - name: 검증자 채점 (confirm/refute recall 게이트)
        run: python3 humans/review-fixtures/eval_verifier.py --verdicts "$RUNNER_TEMP/goldenset/run_verdicts.json"

      - name: 결과 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldenset-run
          path: |
            ${{ runner.temp }}/goldenset/run_findings.json
            ${{ runner.temp }}/goldenset/run_verdicts.json
          if-no-files-found: ignore
