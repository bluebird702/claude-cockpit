# tools.yaml — 이 봇이 접근 가능한 MCP 서버와 내장 도구 목록
#
# MCP 서버는 core/mcp-shared/servers.json 에 정의된 것 중에서만 선택 가능.
# 각 도구는 allowlist 기반 — 여기 없으면 사용 불가.

mcp_servers:
  # - github             # 레포 읽기·PR 생성 (GitHub App 필요)
  # - knowledge          # 회사 지식 DB
  # - slack-internal     # 다른 채널 읽기 (읽기 전용)

builtin_tools:
  read_file: true        # worker 디렉토리 + 허용된 공유 리소스만
  write_file: false      # HITL 없이는 금지
  bash: false            # 기본 금지, 필요 시 allowlist 명시
  # bash_allowlist:
  #   - "git status"
  #   - "git log --oneline -20"

external_apis:
  # 외부 HTTP 호출 allowlist. 이 목록에 없는 도메인은 거부.
  # - "api.anthropic.com"
  # - "api.github.com"
  []
